name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm run check-lockfile
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
